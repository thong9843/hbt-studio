<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        width: 1080px;
        height: 1920px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 160px;
      }
      .chat-card {
        width: 936px;
        max-height: 1280px;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 36px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      /* Header chuẩn Instagram Direct iOS (không Status Bar) */
      .header {
        height: 120px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        border-bottom: 1.5px solid #efefef;
        flex-shrink: 0;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }
      .story-ring {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        padding: 3.5px;
        background: linear-gradient(45deg, #f58529 0%, #dd2a7b 50%, #8134af 100%);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .story-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        padding: 2.5px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background: #dbdbdb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 700;
        color: #ffffff;
      }
      .header-info {
        min-width: 0;
      }
      .header-name {
        font-size: 31px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .header-status {
        margin-top: 3px;
        font-size: 22px;
        font-weight: 500;
        color: #737373;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 28px;
        flex-shrink: 0;
      }
      /* Luồng tin nhắn Instagram DM iOS */
      .thread-viewport {
        flex: 1;
        min-height: 260px;
        max-height: 1044px;
        overflow: hidden;
        padding: 22px 24px 18px;
        background: #ffffff;
      }
      .thread-inner {
        display: flex;
        flex-direction: column;
      }
      .msg-row {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        margin-top: 16px;
      }
      .msg-row.grouped {
        margin-top: 6px;
      }
      .msg-row.first {
        margin-top: 0;
      }
      .msg-row.right {
        justify-content: flex-end;
      }
      .msg-avatar-slot {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
      }
      .msg-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
      }
      .bubble-col {
        display: flex;
        flex-direction: column;
        max-width: 640px;
      }
      .msg-row.right .bubble-col {
        align-items: flex-end;
      }
      .sender-label {
        font-size: 20px;
        font-weight: 600;
        color: #737373;
        margin: 0 0 4px 14px;
      }
      .bubble {
        position: relative;
        padding: 16px 24px;
        font-size: 36px;
        line-height: 1.32;
        word-break: break-word;
        border-radius: 34px;
      }
      .bubble.left {
        background: #efefef;
        color: #000000;
      }
      .bubble.right {
        background: linear-gradient(180deg, #5b51d8 0%, #833ab4 50%, #c13584 100%);
        color: #ffffff;
      }
      .bubble.left.g-top {
        border-bottom-left-radius: 6px;
      }
      .bubble.left.g-mid {
        border-top-left-radius: 6px;
        border-bottom-left-radius: 6px;
      }
      .bubble.left.g-bot {
        border-top-left-radius: 6px;
      }
      .bubble.right.g-top {
        border-bottom-right-radius: 6px;
      }
      .bubble.right.g-mid {
        border-top-right-radius: 6px;
        border-bottom-right-radius: 6px;
      }
      .bubble.right.g-bot {
        border-top-right-radius: 6px;
      }
      .media-img {
        display: block;
        max-width: 560px;
        max-height: 460px;
        border-radius: 24px;
        object-fit: cover;
        margin-bottom: 8px;
      }
      .media-video-box {
        width: 520px;
        height: 292px;
        border-radius: 24px;
        background: transparent;
        margin-bottom: 8px;
      }
      .sticker-img {
        display: block;
        width: 196px;
        height: 196px;
        object-fit: contain;
        margin-top: 6px;
      }
      .reaction-pill {
        position: absolute;
        right: 12px;
        bottom: -14px;
        background: #ffffff;
        border: 2px solid #efefef;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 22px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      .seen-label {
        align-self: flex-end;
        margin-top: 6px;
        font-size: 20px;
        font-weight: 600;
        color: #737373;
      }
      .typing-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }
      .typing-bubble {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 18px 24px;
        border-radius: 30px;
        background: #efefef;
      }
      .typing-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #8e8e93;
      }
      /* Thanh nhập tin nhắn chuẩn Instagram DM iOS */
      .input-bar {
        height: 116px;
        padding: 0 24px;
        display: flex;
        align-items: center;
        background: #ffffff;
        flex-shrink: 0;
      }
      .ig-pill {
        width: 100%;
        height: 76px;
        border-radius: 999px;
        background: #efefef;
        padding: 0 22px 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .ig-cam-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #3797f0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .ig-placeholder {
        flex: 1;
        font-size: 28px;
        font-weight: 500;
        color: #737373;
      }
      .ig-icons {
        display: flex;
        align-items: center;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="chat-card" id="card">
        <header class="header">
          <div class="header-left">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0F172A"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            <div class="story-ring">
              <div class="story-inner">
                <div class="avatar-img" id="hdr-avatar"></div>
              </div>
            </div>
            <div class="header-info">
              <div class="header-name" id="hdr-name">Người dùng</div>
              <div class="header-status" id="hdr-status">Đang hoạt động</div>
            </div>
          </div>
          <div class="header-actions">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0F172A"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
              />
            </svg>
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0F172A"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="23 7 16 12 23 17 23 7" />
              <rect x="1" y="5" width="15" height="14" rx="3" ry="3" />
            </svg>
          </div>
        </header>

        <div class="thread-viewport" id="viewport">
          <div class="thread-inner" id="thread"></div>
        </div>

        <footer class="input-bar">
          <div class="ig-pill">
            <div class="ig-cam-btn">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF">
                <path
                  d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                />
                <circle cx="12" cy="13" r="4" fill="#3797F0" />
              </svg>
            </div>
            <span class="ig-placeholder">Nhắn tin...</span>
            <div class="ig-icons">
              <svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0F172A"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="23" />
              </svg>
              <svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0F172A"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <circle cx="8.5" cy="8.5" r="1.5" fill="#0F172A" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
              <svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0F172A"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-linecap="round" />
                <line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.6" stroke-linecap="round" />
                <line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.6" stroke-linecap="round" />
              </svg>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <script>
      window.renderChatState = function (state) {
        const hdrName = document.getElementById('hdr-name');
        const hdrStatus = document.getElementById('hdr-status');
        const hdrAvatar = document.getElementById('hdr-avatar');
        hdrName.textContent = state.header.name;
        hdrStatus.textContent = state.header.status || 'Đang hoạt động';
        if (state.header.avatarUrl) {
          hdrAvatar.innerHTML = `<img src="${state.header.avatarUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
        } else {
          hdrAvatar.style.background = state.header.color || '#833AB4';
          hdrAvatar.textContent = (state.header.name || '?')[0].toUpperCase();
        }

        const thread = document.getElementById('thread');
        thread.innerHTML = '';
        thread.style.transform = `translateY(${-(state.scrollY || 0)}px)`;

        const msgs = state.messages || [];
        msgs.forEach((m, idx) => {
          const prev = idx > 0 ? msgs[idx - 1] : null;
          const next = idx < msgs.length - 1 ? msgs[idx + 1] : null;
          const samePrev = prev && prev.from === m.from;
          const sameNext = next && next.from === m.from;

          const row = document.createElement('div');
          row.className = `msg-row ${m.side} ${idx === 0 ? 'first' : samePrev ? 'grouped' : ''}`;
          if (idx === msgs.length - 1 && state.popupScale && state.popupScale < 1) {
            row.style.transform = `scale(${state.popupScale})`;
            row.style.transformOrigin = m.side === 'right' ? 'right bottom' : 'left bottom';
          }

          if (m.side === 'left') {
            const slot = document.createElement('div');
            slot.className = 'msg-avatar-slot';
            if (!sameNext) {
              const av = document.createElement('div');
              av.className = 'msg-avatar';
              if (m.avatarUrl) {
                av.innerHTML = `<img src="${m.avatarUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
              } else {
                av.style.background = m.color || '#737373';
                av.textContent = (m.senderName || '?')[0].toUpperCase();
              }
              slot.appendChild(av);
            }
            row.appendChild(slot);
          }

          const col = document.createElement('div');
          col.className = 'bubble-col';
          if (state.isGroup && m.side === 'left' && !samePrev && m.senderName) {
            const lbl = document.createElement('div');
            lbl.className = 'sender-label';
            lbl.textContent = m.senderName;
            col.appendChild(lbl);
          }

          let groupCls = '';
          if (samePrev && sameNext) groupCls = 'g-mid';
          else if (!samePrev && sameNext) groupCls = 'g-top';
          else if (samePrev && !sameNext) groupCls = 'g-bot';

          if (m.mediaUrl && m.mediaType === 'image') {
            const img = document.createElement('img');
            img.className = 'media-img';
            img.src = m.mediaUrl;
            col.appendChild(img);
          } else if (m.mediaType === 'video') {
            const box = document.createElement('div');
            box.className = 'media-video-box';
            col.appendChild(box);
          }

          if (m.text) {
            const b = document.createElement('div');
            b.className = `bubble ${m.side} ${groupCls}`;
            b.textContent = m.text;
            if (m.reaction) {
              const r = document.createElement('span');
              r.className = 'reaction-pill';
              r.textContent = m.reaction;
              b.appendChild(r);
            }
            col.appendChild(b);
          }

          if (m.stickerUrl) {
            const st = document.createElement('img');
            st.className = 'sticker-img';
            st.src = m.stickerUrl;
            col.appendChild(st);
          }

          row.appendChild(col);
          thread.appendChild(row);
        });

        if (msgs.length > 0 && msgs[msgs.length - 1].side === 'right' && state.seenText) {
          const seen = document.createElement('div');
          seen.className = 'seen-label';
          seen.textContent = state.seenText;
          thread.appendChild(seen);
        }

        if (state.showTyping) {
          const tRow = document.createElement('div');
          tRow.className = 'typing-row';
          const slot = document.createElement('div');
          slot.className = 'msg-avatar-slot';
          tRow.appendChild(slot);
          const tb = document.createElement('div');
          tb.className = 'typing-bubble';
          const p = state.typingPulse || 0;
          for (let i = 0; i < 3; i++) {
            const d = document.createElement('span');
            d.className = 'typing-dot';
            const dy = Math.sin((p + i * 2) * 0.5) * 4;
            d.style.transform = `translateY(${dy}px)`;
            tb.appendChild(d);
          }
          tRow.appendChild(tb);
          thread.appendChild(tRow);
        }
      };
    </script>
  </body>
</html>
