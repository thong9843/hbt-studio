[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbt"
version = "0.1.0"
description = "HBT Studio — dựng video ngắn tiếng Việt (backend)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pillow>=10",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "sse-starlette>=2",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["hbt*"]

[tool.setuptools.package-data]
hbt = ["fonts/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: dựng/căn chữ thật, >= 3 s mỗi test trên máy cũ (pytest --durations=0). Chạy nhanh: pytest -m \"not slow\"",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
