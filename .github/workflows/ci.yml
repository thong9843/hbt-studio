name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          pip install -e "backend[dev]"
          npm ci

      - name: Lint
        run: npm run lint

      # Không cần GPU hay FFmpeg: test /health tự giả lập môi trường.
      - name: Test
        run: npm run test
