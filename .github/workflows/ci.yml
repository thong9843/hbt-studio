name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          echo "::notice title=Môi trường CI::$(ffmpeg -version | head -1) | $(python --version) | $(. /etc/os-release && echo "$PRETTY_NAME")"

      - name: Install
        run: |
          pip install -e "backend[dev]"
          npm ci

      - name: Lint
        run: npm run lint

      - name: Build web
        run: npm run build

      # Không cần GPU. Test cần FFmpeg sẽ THẤT BẠI (không bỏ qua) nếu runner thiếu FFmpeg vì CI=true.
      - name: Test
        run: npm run test
        env:
          PYTEST_ADDOPTS: --junitxml=pytest-report.xml

      # Nhật ký job cần quyền admin để tải; chú thích thì đọc được qua API công khai.
      - name: Show failed tests as annotations
        if: failure()
        run: python scripts/ci_annotate.py pytest-report.xml
