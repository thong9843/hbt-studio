<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b22228" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/hbt-avatar-32.png" />
    <link rel="apple-touch-icon" href="/brand/hbt-avatar-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/fonts/BeVietnamPro-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <title>HBT Studio</title>
    <script>
      /* Áp chế độ đã lưu trước lần vẽ đầu để không nháy màn. Khoá khớp src/utils/theme.ts. */
      (function () {
        try {
          var t = localStorage.getItem('hbt-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
